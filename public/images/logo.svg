<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Premium Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6B16B" />
      <stop offset="50%" stop-color="#E4C78A" />
      <stop offset="100%" stop-color="#B88A44" />
    </linearGradient>
    
    <!-- Deep Sapphire Cosmic Glow Gradient -->
    <linearGradient id="sapphireGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ED4FF" />
      <stop offset="100%" stop-color="#4FAFE8" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#05070A" rx="24" />

  <!-- Outer Astral Orbit Rings -->
  <circle cx="250" cy="230" r="160" fill="none" stroke="url(#sapphireGrad)" stroke-width="1" stroke-dasharray="8,8" opacity="0.3" />
  <circle cx="250" cy="230" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4" />
  <circle cx="250" cy="230" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="40,200" opacity="0.8" />

  <!-- Core Geometric Mandala Base (Awwwards Style) -->
  <g filter="url(#softGlow)">
    <!-- Rotating Diamond Star Frame -->
    <polygon points="250,90 370,230 250,370 130,230" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8" />
    <polygon points="250,110 350,230 250,350 150,230" fill="none" stroke="url(#sapphireGrad)" stroke-width="1" opacity="0.5" />
    
    <!-- Central Modern Stylized "S" Emblem -->
    <path d="M 220 180 
             C 220 150, 280 150, 280 180 
             C 280 210, 220 220, 220 250 
             C 220 280, 280 280, 280 250" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Decorative Center Dots -->
    <circle cx="250" cy="230" r="5" fill="#FFFFFF" />
  </g>

  <!-- Typography: S I T O R A -->
  <text x="250" y="425" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="0.45em" 
        fill="#FFFFFF" 
        text-anchor="middle">
    SITORA
  </text>
  
  <!-- Sub-label -->
  <text x="250" y="450" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="11" 
        font-weight="500" 
        letter-spacing="0.7em" 
        fill="url(#goldGrad)" 
        text-anchor="middle"
        opacity="0.9">
    WEB SOLUTIONS
  </text>
</svg>
