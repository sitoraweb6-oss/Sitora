<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Premium Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6B16B" />
      <stop offset="50%" stop-color="#E4C78A" />
      <stop offset="100%" stop-color="#B88A44" />
    </linearGradient>
    
    <!-- Deep Sapphire Cosmic Glow Gradient -->
    <linearGradient id="sapphireGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ED4FF" />
      <stop offset="100%" stop-color="#4FAFE8" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Luxury Background for Favicon Grid -->
  <rect width="100%" height="100%" fill="#05070A" rx="100" />

  <!-- Outer Astral Orbit Rings -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="url(#sapphireGrad)" stroke-width="2" stroke-dasharray="10,10" opacity="0.4" />
  <circle cx="250" cy="250" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="60,200" opacity="0.9" />

  <!-- Core Geometric Mandala Base (Awwwards Style) -->
  <g filter="url(#softGlow)" transform="translate(0, 20)">
    <!-- Rotating Diamond Star Frame -->
    <polygon points="250,90 370,230 250,370 130,230" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.95" />
    <polygon points="250,110 350,230 250,350 150,230" fill="none" stroke="url(#sapphireGrad)" stroke-width="2.5" opacity="0.75" />
    
    <!-- Central Modern Stylized "S" Emblem -->
    <path d="M 220 180 
             C 220 150, 280 150, 280 180 
             C 280 210, 220 220, 220 250 
             C 220 280, 280 280, 280 250" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Decorative Center Dots -->
    <circle cx="250" cy="230" r="6" fill="#FFFFFF" />
  </g>
</svg>
